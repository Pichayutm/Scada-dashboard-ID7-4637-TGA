<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SCADA/DMS — Installation Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f8f9fc;--surface:#ffffff;--card:#ffffff;--elevated:#ffffff;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;--text4:#cbd5e1;
  --border:#e2e8f0;--border2:#f1f5f9;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-soft:#dbeafe;
  --green:#059669;--green-bg:#ecfdf5;--green-soft:#d1fae5;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-soft:#fef3c7;
  --red:#dc2626;--red-bg:#fef2f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --teal:#0d9488;--teal-bg:#f0fdfa;
  --coral:#ea580c;--coral-bg:#fff7ed;
  --navy:#1e293b;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.05),0 2px 4px -2px rgba(0,0,0,0.05);
  --font:'Inter','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0e18;--surface:#13172a;--card:#181d32;--elevated:#1f253d;
  --text:#f1f5f9;--text2:#b0bec5;--text3:#8896a6;--text4:#5a6577;
  --border:#2a3148;--border2:#232942;
  --blue:#7cb8ff;--blue-bg:#1a2744;--blue-soft:#1e3050;
  --green:#5ee8b7;--green-bg:#0f2d23;--green-soft:#133d2e;
  --amber:#ffd166;--amber-bg:#2d2210;--amber-soft:#3d3018;
  --red:#ff8a8a;--red-bg:#2d1515;
  --purple:#b8a5ff;--purple-bg:#231845;
  --teal:#6ee7d0;--teal-bg:#0f2928;
  --coral:#ffab76;--coral-bg:#2d1a0e;
  --navy:#1e2640;
  --shadow:0 1px 3px rgba(0,0,0,0.3);--shadow-md:0 4px 12px rgba(0,0,0,0.4);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:0 24px 60px}

/* ── HERO HEADER ── */
.hero{padding:40px 0 32px;position:relative}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero-sub{font-size:14px;color:var(--text2);margin-top:6px;font-weight:400}
.hero-badge{display:flex;gap:8px;flex-wrap:wrap}
.hero-badge .pill{font-size:11px;font-weight:500;padding:5px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text2)}


/* ── GOOGLE SHEETS BAR ── */
.gsheet-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;margin-bottom:20px;flex-wrap:wrap}
.gs-icon{font-size:20px;flex-shrink:0}
.gs-body{flex:1;min-width:200px}
.gs-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:3px}
.gs-input{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:7px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);outline:none;transition:border 0.2s}
.gs-input:focus{border-color:var(--blue)}
.gs-btn{border:none;background:var(--blue);color:#fff;padding:8px 18px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:opacity 0.2s}
.gs-btn:hover{opacity:0.85}
.gs-btn2{background:var(--border);color:var(--text2)}
.gs-btn2.active{background:var(--green);color:#fff}
.gs-status{font-size:11px;color:var(--green);margin-left:8px;flex-basis:100%;margin-top:4px;display:none}
.gs-status.show{display:block}

/* ── DROP ZONE ── */
.drop{border:1.5px dashed var(--border);border-radius:var(--radius);padding:14px 24px;text-align:center;color:var(--text3);font-size:13px;cursor:pointer;transition:all 0.25s;position:relative;margin:0 0 28px;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{font-weight:500}

/* ── METRIC RINGS ── */
.ring-row{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;margin-bottom:32px}
@media(max-width:900px){.ring-row{grid-template-columns:1fr}}
.ring-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px}
.ring-card svg{flex-shrink:0}
.ring-info .ri-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text3);font-weight:500}
.ring-info .ri-value{font-size:24px;font-weight:700;letter-spacing:-0.5px;margin:2px 0}
.ring-info .ri-sub{font-size:12px;color:var(--text2)}

/* ── NAVIGATION ── */
.nav{display:flex;gap:4px;margin-bottom:24px;position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0}
.nav button{border:none;background:var(--surface);border:1px solid var(--border);padding:10px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:var(--radius-sm);font-family:var(--font);transition:all 0.15s}
.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav button:hover:not(.active){background:var(--border2);border-color:var(--border)}

.panel{display:none}.panel.active{display:block}

/* ── PROJECTS ── */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:28px}
.proj{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px 20px;position:relative;overflow:hidden}
.proj .proj-glow{position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;opacity:0.06;pointer-events:none}
.proj .proj-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.proj .proj-hdr .proj-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.proj .proj-hdr .proj-name{font-size:17px;font-weight:700;letter-spacing:-0.3px;flex:1}
.proj .proj-hdr .proj-loops{font-size:10px;font-weight:600;padding:4px 12px;border-radius:14px;background:var(--elevated);color:var(--text2)}

/* Timeline slider */
.tl-slider{margin-bottom:20px}
.tl-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.tl-date{font-size:11px;color:var(--text3)}
.tl-date b{display:block;font-size:13px;color:var(--text);font-weight:600}
.tl-pct-center{text-align:center}
.tl-pct-big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.tl-pct-label{font-size:10px;color:var(--text3);margin-top:2px}
.tl-track{position:relative;height:6px;background:var(--border);border-radius:3px;margin:0 0 6px}
.tl-track .tl-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width 0.8s}
.tl-track .tl-knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;border:3px solid;transform:translate(-50%,-50%);transition:left 0.8s;box-shadow:0 0 8px rgba(0,0,0,0.2)}
.tl-bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.tl-bottom .tl-remain{font-weight:600}

/* Risk badge */
.tl-risk{text-align:center;margin-top:10px}
.risk-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 14px;border-radius:14px;font-size:11px;font-weight:600}
.rp-green{background:rgba(5,150,105,0.12);color:#5ee8b7}
.rp-amber{background:rgba(217,119,6,0.12);color:#ffd166}
.rp-red{background:rgba(220,38,38,0.12);color:#ff8a8a}
.rp-gray{background:var(--elevated);color:var(--text3)}

/* Device boxes */
.proj-devs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.proj-dev{text-align:center;padding:10px 4px;background:var(--bg);border-radius:10px}
.proj-dev .pd-v{font-size:20px;font-weight:800;letter-spacing:-0.3px}
.proj-dev .pd-l{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-top:2px;font-weight:500}
.proj-dev .pd-cancel{font-size:9px;color:var(--red);margin-top:2px;font-weight:500}

/* Bottom meters */
.proj-meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.proj-meters .pm{text-align:center;padding-top:14px;border-top:1px solid var(--border)}
.proj-meters .pm .pm-v{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.proj-meters .pm .pm-l{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px}

/* ── ROUTE CARDS ── */
.grp-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.grp-title::after{content:'';flex:1;height:1px;background:var(--border)}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
@media(max-width:440px){.routes{grid-template-columns:1fr}}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;transition:all 0.2s;position:relative;overflow:hidden}
.rc:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rc .accent{position:absolute;top:0;left:0;right:0;height:3px}
.rc .rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.rc .rname{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.rc .rnode{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);background:var(--border2);padding:3px 10px;border-radius:12px;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:11px;font-weight:500;color:var(--text3);width:62px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.3px}
.bar-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-pct{font-size:12px;font-weight:600;width:40px;text-align:right;flex-shrink:0}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;padding-top:12px;border-top:1px solid var(--border2)}
.rc-stat{text-align:center}
.rc-stat:not(:last-child){border-right:1px solid var(--border2)}
.rc-stat .sv{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.rc-stat .sl{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-top:1px}
.rc-devs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.rc-dev{text-align:center;padding:6px 2px;background:var(--bg);border-radius:8px}
.rc-dev .rd-v{font-size:14px;font-weight:700}
.rc-dev .rd-l{font-size:8px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text3)}
.rc-dev .rd-d{font-size:8px;color:var(--green);font-weight:600}

/* ── CHARTS ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.chart-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.chart-card .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text3);margin-bottom:14px}
.chart-card .legend .d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-0.5px}
.chart-wrap{position:relative;height:260px}
.chart-wrap.tall{height:320px}

/* ── ISSUES ── */
.issues-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.issues-proj{margin-bottom:28px}
.issues-proj-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid}
.iss-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;border-left:3px solid}
.iss-num{font-size:28px;font-weight:800;line-height:1;min-width:40px;text-align:center}
.iss-body h4{font-size:13px;font-weight:600;margin-bottom:4px}
.iss-body p{font-size:11px;color:var(--text2);line-height:1.6}
.iss-items{margin-top:6px;font-size:10px;color:var(--text3);line-height:1.8}
.iss-items li{list-style:none;padding-left:12px;position:relative}
.iss-items li::before{content:"•";position:absolute;left:0}

.footer{text-align:center;padding:32px 0 0;font-size:11px;color:var(--text3)}


/* ── EQUIPMENT TABLE ── */
.eq-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.eq-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.eq-table thead th{background:var(--navy);color:#f1f5f9;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:10px;padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:2}
.eq-table thead th.grp{background:var(--navy);text-align:center;border-left:1px solid rgba(255,255,255,0.08)}
.eq-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle;color:var(--text)}
.eq-table tbody tr:hover{background:var(--blue-bg)}
.eq-table tbody tr:last-child td{border-bottom:none}
.eq-table .route-col{font-weight:600;font-size:13px;position:sticky;left:0;background:var(--card);z-index:1;min-width:100px;color:var(--text)}
.eq-table tbody tr:hover .route-col{background:var(--blue-bg)}
.eq-table .node-col{color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:0.3px}
.eq-table .num{text-align:center;font-variant-numeric:tabular-nums;color:var(--text)}
.eq-table .num.zero{color:var(--text3)}
.eq-table .num.done{color:var(--green);font-weight:600}
.eq-table .pct-cell{text-align:center;font-weight:600;font-size:11px}
.eq-table .pct-pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:600}
.eq-table .pct-0{background:var(--border);color:var(--text3)}
.eq-table .pct-low{background:var(--amber-bg);color:var(--amber)}
.eq-table .pct-mid{background:var(--blue-bg);color:var(--blue)}
.eq-table .pct-high{background:var(--green-bg);color:var(--green)}
.eq-table tfoot td{background:var(--navy);color:#f1f5f9;font-weight:700;padding:10px 12px;font-size:12px}
.eq-table .sep{border-left:1px solid var(--border)}
.eq-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.eq-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px}
.eq-sm .eq-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.eq-sm .eq-info .eq-v{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.eq-sm .eq-info .eq-l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;opacity:0;transition:all 0.3s;z-index:999;pointer-events:none;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp 0.5s ease both}
.anim-d1{animation-delay:0.05s}.anim-d2{animation-delay:0.1s}.anim-d3{animation-delay:0.15s}.anim-d4{animation-delay:0.2s}
</style>
</head>
<body>
<div class="app">

<div class="hero anim">
  <div class="hero-top">
    <div>
      <h1>SCADA/<em>DMS</em> Installation</h1>
      <p class="hero-sub">ระบบติดตามงานติดตั้งสายใยแก้วนำแสง — การไฟฟ้านครหลวง</p>
    </div>
    <div class="hero-badge">
      <span class="pill">สัญญา ID7-4637-TGA</span>
      <span class="pill" id="updateBadge">—</span>
    </div>
  </div>
</div>

<div class="drop anim anim-d1" id="dropZone">
  <input type="file" accept=".xlsx,.xls" id="fileInput">
  📂 <b>ลากไฟล์ Summary Excel มาวางที่นี่</b> หรือคลิกเพื่อเลือกไฟล์
</div>

<div class="gsheet-bar anim anim-d1" id="gsheetBar">
  <div class="gs-icon">📊</div>
  <div class="gs-body">
    <div class="gs-label">Google Sheets URL</div>
    <input type="text" id="gsUrl" placeholder="วาง URL ของ Google Sheets ที่นี่ เช่น https://docs.google.com/spreadsheets/d/xxxxx/edit" class="gs-input">
  </div>
  <button id="gsLoad" class="gs-btn">โหลดข้อมูล</button>
  <button id="gsAuto" class="gs-btn gs-btn2" title="โหลดอัตโนมัติทุกครั้งที่เปิด">Auto ❌</button>
</div>

<div class="ring-row anim anim-d2" id="ringRow"></div>

<div class="nav anim anim-d3" id="navBar">
  <button class="active" data-tab="routes">Routes</button>
  <button data-tab="charts">Charts</button>
  <button data-tab="equip">อุปกรณ์</button>
  <button data-tab="issues">ปัญหา</button>
</div>

<div class="panel active" id="panel-routes"></div>
<div class="panel" id="panel-charts"></div>
<div class="panel" id="panel-equip"></div>
<div class="panel" id="panel-issues"></div>

<div class="footer" id="footerTime"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA — แก้ตรงนี้เพื่ออัปเดตด้วยมือ
// ═══════════════════════════════════════════════════════
let DATA = {
  routes: [
    {id:'BHD-CK02',group:'สายสีเหลือง — ถ.ลาดพร้าว',node:'สย.จันทรเกษม',color:'#facc15',ofc:11628,ofcAct:0,sub:5566,subAct:0,subExist:0,odf:24,mfdf:7,fdf:2,odfAct:0,mfdfAct:0,fdfAct:0,termAct:0,lbs:0,lbsDone:0,rmu:0,rmuDone:0,us:0,usDone:0},

const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:1});
const pct=(a,b)=>b>0?Math.round(a/b*100):0;

function ring(size,pct,color,bg){
  const r=size/2-4,c=2*Math.PI*r,d=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg}" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${d}" stroke-linecap="round" style="transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"/>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" fill="var(--text)" font-size="13" font-weight="700" style="transform:rotate(90deg);transform-origin:center">${pct}%</text>
  </svg>`;
}

      const remainDays=Math.ceil((endD-now)/(864e5));

function parseExcel(ab){
  try{
    const wb=XLSX.read(ab,{type:'array'});
    const sn=wb.SheetNames.find(n=>n.includes('Actual'))||wb.SheetNames[1];
    if(!sn){toast('❌ ไม่พบ sheet "Actual Ins."');return}
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    const rm={'BHD-CK02':/BHD-CK02/i,'BHD-CK03':/BHD-CK03/i,'NCD-KJ01':/NCD-KJ01|คลองจั่น.*KJ01/i,'NCD-KJ02':/NCD-KJ02|คลองจั่น.*KJ02/i,'NCD-WT01':/NCD-WT01|วังทองหลาง.*WT01/i,'NCD-WT02':/NCD-WT02|วังทองหลาง.*WT02/i,'SPD-BMU01':/SPD-BMU01|บางเมือง 1|บางเมือง.*01/i,'SPD-BMU02':/SPD-BMU02|บางเมือง 2|บางเมือง.*02/i,'SPD-SRS01':/SPD-SRS01|สำโรง/i,'BHD-CK04':/BHD-CK04/i};
    let cur=null;
    for(let i=0;i<raw.length;i++){
      const row=raw[i],txt=row.join(' ');
      for(const[id,rx]of Object.entries(rm)){if(rx.test(txt)&&/ROUTE|สถานี|โครงการ/.test(txt)){cur=id;break}}
      if(!cur)continue;const r=DATA.routes.find(x=>x.id===cur);if(!r)continue;
      if(/ADSS-FR.*Fiber.*CABLE/i.test(txt)){const d=row.find(c=>typeof c==='number'&&c>1000);if(d)r.ofc=d;const a=row.slice(4).find(c=>typeof c==='number'&&c>=0);if(a!==undefined)r.ofcAct=a}
      if(/Sub-Duct|Sub.Duct/i.test(txt)&&!/CABLE/i.test(txt)){const d=row.find(c=>typeof c==='number'&&c>100);if(d)r.sub=d;const ai=row.findIndex((c,idx)=>idx>3&&typeof c==='number'&&c>=0);if(ai>3)r.subAct=row[ai]}
      if(/Outdoor.*Fiber.*Distribution/i.test(txt)&&!/Mini/i.test(txt)){const v=row.find(c=>typeof c==='number'&&c>0&&c<500);if(v)r.odf=v}
      if(/Mini.*FDF|Mini.*Fiber/i.test(txt)){const v=row.find(c=>typeof c==='number'&&c>=0&&c<200);if(v!==undefined)r.mfdf=v}
      if(/Fiber Distribution Frame.*FDF/i.test(txt)&&!/Outdoor|Mini/i.test(txt)){const v=row.find(c=>typeof c==='number'&&c>0&&c<50);if(v)r.fdf=v}
    }
    
      if(/Terminate|ติดตั้ง FDF|Terminating/i.test(txt)){
        const v=row.find(c=>typeof c==='number'&&c>=0);
        if(v!==undefined)r.termAct=v;
      }
    DATA.ts=new Date().toLocaleString('th-TH');render();toast('✅ อัปเดตจาก Excel สำเร็จ!');
  }catch(e){console.error(e);toast('❌ อ่านไฟล์ไม่ได้: '+e.message)}
}

// ═══════════════════════════════════════════════════════
// GOOGLE SHEETS INTEGRATION
// ═══════════════════════════════════════════════════════
function extractSheetId(url){
  const m1 = url.match(/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m1) return m1[1];
  const m2 = url.match(/spreadsheets\/d\/e\/([a-zA-Z0-9_-]+)/);
  if(m2) return 'pub:'+m2[1];
  return null;
}

async function fetchSheet(sheetId, sheetName){
  const isPub = sheetId.startsWith('pub:');
  const id = isPub ? sheetId.slice(4) : sheetId;
  const gidMap = {'routes':0, 'projects':1, 'issues':2};
  const gid = gidMap[sheetName] !== undefined ? gidMap[sheetName] : 0;
  
  const urls = isPub ? [
    `https://docs.google.com/spreadsheets/d/e/${id}/pub?output=csv&gid=${gid}`,
  ] : [
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`,
    `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`,
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`,
  ];
  
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = await res.text();
      if (text.includes('<!DOCTYPE') || text.includes('<html') || text.length < 10) continue;
      const parsed = parseCSV(text);
      if (parsed.length > 0) return parsed;
    } catch(e) { lastErr = e; }
  }
  throw new Error('ไม่สามารถอ่าน sheet "'+sheetName+'" ได้ — กรุณา Publish to web (File → Share → Publish to web)');
}

function parseCSV(text){
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(inQ){if(c==='"'&&n==='"'){field+='"';i++}else if(c==='"'){inQ=false}else{field+=c}}
    else{if(c==='"'){inQ=true}else if(c===','){row.push(field.trim());field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&n==='\n')i++;row.push(field.trim());if(row.some(x=>x))rows.push(row);row=[];field=''}else{field+=c}}
  }
  row.push(field.trim());if(row.some(x=>x))rows.push(row);
  if(rows.length<2)return[];
  const headers=rows[0].map(h=>h.replace(/^"|"$/g,'').trim().toLowerCase());
  return rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>{o[h]=r[i]?r[i].replace(/^"|"$/g,'').trim():''});return o});
}

async function loadFromGoogleSheets(){
  const url=document.getElementById('gsUrl').value.trim();
  if(!url){toast('⚠️ กรุณาวาง Google Sheets URL');return}
  const id=extractSheetId(url);
  if(!id){toast('❌ URL ไม่ถูกต้อง — ต้องเป็น URL ของ Google Sheets');return}

  // สำรองข้อมูลเดิมไว้ก่อน กันหาย
  const backup=JSON.parse(JSON.stringify(DATA));
  toast('⏳ กำลังโหลดข้อมูลจาก Google Sheets...');

  try{
    // Fetch routes sheet
    const routes=await fetchSheet(id,'routes');
    if(!routes||routes.length===0){throw new Error('Sheet "routes" ว่างเปล่าหรือไม่พบ')}
    
    const newRoutes=routes.map(r=>({
      id:r.route_id||'',group:r.group||'',node:r.node||'',color:r.color||'#2563eb',
      ofc:parseFloat(r.ofc_design)||0, ofcAct:parseFloat(r.ofc_actual)||0,
      lbs:parseInt(r.lbs_qty)||0, lbsDone:parseInt(r.lbs_done)||0,
      rmu:parseInt(r.rmu_qty)||0, rmuDone:parseInt(r.rmu_done)||0,
      us:parseInt(r.us_qty)||0, usDone:parseInt(r.us_done)||0,
      sub:parseFloat(r.sub_design)||0, subAct:parseFloat(r.sub_actual)||0, subExist:parseFloat(r.sub_existing)||0,
      fdf:parseInt(r.fdf_qty)||0, fdfAct:parseInt(r.fdf_done)||0,
      odf:parseInt(r.odf_qty)||0, odfAct:parseInt(r.odf_done)||0,
      mfdf:parseInt(r.mini_fdf_qty)||0, mfdfAct:parseInt(r.mini_fdf_done)||0,
      termAct:parseInt(r.term_done)||0,
    }));
    
    // ตรวจสอบว่าข้อมูลสมเหตุสมผล
    if(!newRoutes[0].id){throw new Error('ข้อมูล route_id ว่าง — ตรวจสอบ header ใน Sheet "routes"')}
    DATA.routes=newRoutes;

    // Fetch projects sheet
    try{
      const proj=await fetchSheet(id,'projects');
      if(proj&&proj.length>0){
        DATA.projects=proj.map(p=>({
          id:p.project_name||'',icon:p.icon||'🟡',
          lbs:parseInt(p.lbs)||0,lbsCancel:parseInt(p.lbs_cancel)||0,
          rmu:parseInt(p.rmu)||0,rmuCancel:parseInt(p.rmu_cancel)||0,
          us:parseInt(p.us)||0,platform:parseInt(p.platform)||0,
          loops:parseInt(p.loops)||0,
          start:p.start_date||'',
          end:p.end_date||'',
          routes:DATA.routes.filter(r=>{
            if(p.project_name.includes('เทพารักษ์'))return r.group.includes('เทพารักษ์');
            if(p.project_name.includes('เขียวเหนือ'))return r.group.includes('เขียวเหนือ');
            return r.group.includes('ลาดพร้าว')&&!r.group.includes('เขียวเหนือ');
          }).map(r=>r.id)
        }));
      }
    }catch(e){console.log('No projects sheet — ใช้ข้อมูลเดิม',e)}

    // Fetch issues sheet
    try{
      const iss=await fetchSheet(id,'issues');
      if(iss&&iss.length>0){DATA.issues=iss.map(i=>({count:parseInt(i.count)||0,title:i.title||'',detail:i.detail||''}))}
    }catch(e){console.log('No issues sheet — ใช้ข้อมูลเดิม',e)}

    DATA.ts=new Date().toLocaleString('th-TH');
    localStorage.setItem('gs_url',url);
    render();
    toast('✅ โหลดข้อมูลจาก Google Sheets สำเร็จ! ('+DATA.routes.length+' routes)');
  }catch(e){
    console.error(e);
    // คืนข้อมูลเดิม
    DATA.routes=backup.routes;
    DATA.projects=backup.projects;
    DATA.issues=backup.issues;
    render();
    toast('❌ โหลดไม่สำเร็จ: '+e.message+' — ใช้ข้อมูลเดิมแทน');
  }
}

  }
